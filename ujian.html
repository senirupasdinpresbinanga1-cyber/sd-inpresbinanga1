<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian TKA - SD Inpres Binanga 1</title>
    
    <!-- Font, Ikon, dan Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* ANTI SCROLL BROWSER MUTLAK */
        body {
            background-color: #eef2f6;
            color: #333;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* ================= OVERLAYS ================= */
        .full-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .full-overlay .card {
            background: white; color: #333; padding: 50px; border-radius: 16px;
            max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%;
        }
        .btn-start {
            background: #0d6efd; color: white; padding: 15px 30px; border: none;
            border-radius: 10px; font-size: 20px; font-weight: 700; cursor: pointer;
            margin-top: 25px; transition: 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 12px; width: 100%;
        }
        .btn-start:hover { background: #0b5ed7; transform: translateY(-2px); }
        .btn-start:disabled { background: #6c757d; cursor: not-allowed; transform: none; }

        /* ================= CUSTOM MODAL (PENGGANTI ALERT/CONFIRM) ================= */
        #custom-modal, #exit-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 10000; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-box {
            background: white; border-radius: 16px; padding: 30px 40px; text-align: center;
            max-width: 450px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-icon { font-size: 50px; margin-bottom: 15px; color: #ffc107; }
        .modal-title { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 10px; }
        .modal-message { font-size: 15px; color: #555; margin-bottom: 30px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 15px; justify-content: center; }
        
        .btn-modal {
            padding: 10px 25px; border: none; border-radius: 8px; font-size: 16px;
            font-weight: 600; cursor: pointer; transition: 0.2s; flex: 1;
        }
        .btn-modal-cancel { background: #e2e8f0; color: #475569; }
        .btn-modal-cancel:hover { background: #cbd5e1; }
        .btn-modal-confirm { background: #0d6efd; color: white; }
        .btn-modal-confirm:hover { background: #0b5ed7; }

        /* INPUT PASSWORD KELUAR */
        .input-pass {
            width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;
            font-size: 18px; text-align: center; margin-bottom: 25px; outline: none; transition: 0.3s;
            font-family: monospace; font-weight: bold; letter-spacing: 5px;
        }
        .input-pass:focus { border-color: #dc3545; box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1); }

        /* ================= HEADER ================= */
        .header {
            background: #0d47a1; color: white; padding: 15px 40px; display: flex;
            justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: 90px; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left img { width: 60px; height: 60px; background: white; border-radius: 50%; padding: 4px; }
        .header-left h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px;}
        .header-left p { font-size: 14px; color: #bbdefb; letter-spacing: 2px; }

        .header-right { 
            background: rgba(255,255,255,0.1); padding: 10px 25px; border-radius: 12px;
            text-align: right; border: 1px solid rgba(255,255,255,0.2);
        }
        .header-right .nama { font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px;}
        .header-right .kelas { font-size: 15px; color: #90caf9; font-weight: 500; }

        /* ================= KONTEN UTAMA (RATA TENGAH) ================= */
        .main-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
            overflow: hidden; 
        }
        .container {
            display: flex; gap: 30px; width: 100%; max-width: 1400px; height: 100%;
        }

        /* BAGIAN SOAL (KIRI) */
        .question-area {
            flex: 3; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; height: 100%; border: 1px solid #e2e8f0;
        }
        .q-header {
            display: flex; justify-content: space-between; align-items: center; padding: 25px 30px;
            border-bottom: 2px solid #f1f5f9; background: #f8fafc; border-radius: 16px 16px 0 0;
        }
        .q-badge { background: #0d6efd; color: white; padding: 8px 20px; border-radius: 20px; font-size: 18px; font-weight: 700; }
        
        .q-body {
            padding: 30px; overflow-y: auto; flex: 1; 
        }
        .q-text { font-size: 18px; line-height: 1.8; margin-bottom: 35px; color: #1e293b; text-align: justify; }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .option-item {
            display: flex; align-items: center; padding: 18px 25px; border: 2px solid #e2e8f0;
            border-radius: 12px; cursor: pointer; transition: 0.2s; background: #f8fafc; font-size: 16px;
        }
        .option-item:hover { border-color: #93c5fd; background: #eff6ff; }
        .option-item.selected { border-color: #0d6efd; background: #eff6ff; }
        .option-item input[type="radio"] { margin-right: 20px; transform: scale(1.5); cursor: pointer; }

        .q-navigation {
            padding: 25px 30px; display: flex; justify-content: space-between;
            border-top: 2px solid #f1f5f9; background: #f8fafc; border-radius: 0 0 16px 16px;
        }
        .btn-nav {
            padding: 12px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px;
            font-weight: 600; color: white; transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .btn-prev { background: #64748b; } .btn-prev:hover { background: #475569; }
        .btn-next { background: #0d6efd; } .btn-next:hover { background: #0b5ed7; }

        /* BAGIAN NAVIGASI NOMOR SOAL (KANAN) */
        .sidebar {
            flex: 1; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; height: 100%; border: 1px solid #e2e8f0;
        }
        .sidebar-header {
            padding: 25px; border-bottom: 2px solid #f1f5f9; background: #f8fafc;
            border-radius: 16px 16px 0 0; text-align: center;
        }
        .sidebar-header h3 { font-size: 18px; color: #1e293b; }
        
        .sidebar-body {
            padding: 25px; overflow-y: auto; flex: 1;
        }
        .number-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 12px; }

            border-radius: 10px; font-size: 16px; font-weight:

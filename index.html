<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ujian TKA - SD Inpres Binanga 1 Mamuju</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bg {
            background: linear-gradient(135deg, #1a5ca6 0%, #0d47a1 100%);
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
            position: absolute;
            top: 0;
            z-index: 1;
            border-bottom-left-radius: 50% 10%;
            border-bottom-right-radius: 50% 10%;
        }

        .header-content {
            display: flex;
            align-items: center;
            color: white;
            gap: 15px;
        }

        .header-content img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background-color: white;
            border-radius: 50%;
            padding: 5px;
        }

        .header-text h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: -5px;
        }

        .header-text p {
            font-size: 14px;
            font-weight: 400;
            color: #d1e4fb;
            letter-spacing: 2px;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 130px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .contact-info {
            font-size: 11px;
            color: #666;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .contact-info b {
            color: #333;
        }

        .login-card h2 {
            color: #444;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i.icon-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: #555;
        }

        .btn-login {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }
        
        .btn-login:disabled {
            background-color: #6ea8fe;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
        
        .footer p {
            margin-bottom: 5px;
        }

        @media (max-width: 500px) {
            .header-text h1 { font-size: 18px; }
            .header-text p { font-size: 12px; }
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="header-bg">
        <div class="header-content">
            <img src="logo.png" alt="Logo Sekolah" onerror="this.src='https://via.placeholder.com/60/ffffff/000000?text=Logo'">
            <div class="header-text">
                <h1>SD INPRES BINANGA 1</h1>
                <p>TES KEMAMPUAN AKADEMIK TAHUN 2026</p>
            </div>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="contact-info">
                LUPA USERNAME / PASSWORD ? : hubungi <b>Admin Sekolah</b>
            </div>
            
            <h2>Selamat Datang</h2>
            <p class="subtitle">Silakan login menggunakan username dan password yang anda miliki</p>

            <form id="formLogin">
                <div class="input-group">
                    <i class="fas fa-user icon-left"></i>
                    <input type="text" id="username" placeholder="Username (NISN)" required autocomplete="off">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock icon-left"></i>
                    <!-- Placeholder diganti untuk memberi petunjuk bahwa password default adalah 2026 -->
                    <input type="password" id="password" placeholder="Password (Gunakan '2026')" required>
                    <i class="fas fa-eye toggle-password" id="toggleBtn" onclick="togglePasswordVisibility()"></i>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">Login</button>
            </form>
        </div>

        <div class="footer">
            <p>&copy; Copyright 2026, TKA SD Inpres Binanga 1 Mamuju</p>
            <p>Aplikasi Ujian: v1.0.0</p>
        </div>
    </div>

    <script>
        // =========================================================================
        // URL GOOGLE APPS SCRIPT ANDA (JANGAN DIUBAH LAGI JIKA SUDAH BENAR)
        // =========================================================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxVhowRAW6F_fXDIrMfzDghiqswer4QXY4SVr49MKYLKFw0Q__ODW9nHXkorpuBAMyMCA/exec'; 
        // =========================================================================

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("toggleBtn");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }

        const form = document.getElementById("formLogin");
        const btnLogin = document.getElementById("submitBtn");

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            
            const nisn = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();

            // Ubah tombol jadi status loading agar user tidak klik berkali-kali
            btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Memeriksa...';
            btnLogin.disabled = true;

            // Proses Fetch Data ke Google Apps Script (Metode POST)
            const formData = new FormData();
            formData.append('nisn', nisn);
            formData.append('password', password);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    // Cek jika response tidak ok (misalnya karena CORS atau error server)
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    btnLogin.innerHTML = 'Login';
                    btnLogin.disabled = false;

                    if (data.status === 'success') {
                        // Jika berhasil, simpan data sesi ke localStorage
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('nisnSiswa', nisn);      
                        localStorage.setItem('namaSiswa', data.nama);
                        localStorage.setItem('kelasSiswa', data.kelas);
                        localStorage.setItem('role', data.role); // 'siswa' atau 'admin'

                        // Redirect ke halaman yang sesuai
                        if (data.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'ujian.html';
                        }
                    } else {
                        // Jika gagal (password/nisn salah)
                        alert("Login Gagal: " + data.message);
                    }
                })
                .catch(error => {
                    btnLogin.innerHTML = 'Login';
                    btnLogin.disabled = false;
                    alert("Gagal terhubung ke database. Pastikan koneksi internet Anda stabil.");
                    console.error('Error:', error);
                });
        });
    </script>
</body>
</html>
